<!DOCTYPE html>
<html lang="fr">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Connexion — NOSMYBOOST🇧🇪</title>

  <link
    rel="stylesheet"
    href="/css/style.css"
  >

</head>


<body>

  <!-- ================================
       NAVBAR
  ================================= -->

  <header class="navbar">

    <div class="container nav-content">

      <a
        href="/"
        class="logo"
      >
        NOSMYBOOST🇧🇪
      </a>


      <a
        href="/register.html"
        class="btn btn-outline"
      >
        Créer un compte
      </a>

    </div>

  </header>


  <!-- ================================
       CONNEXION
  ================================= -->

  <main>

    <section class="auth-section">

      <div class="auth-card">


        <div class="auth-header">

          <span>
            NOSMYBOOST🇧🇪
          </span>

          <h1>
            Connexion
          </h1>

          <p>
            Connectez-vous à votre espace
            client.
          </p>

        </div>


        <!-- ==========================
             FORMULAIRE
        =========================== -->

        <form
          id="loginForm"
          autocomplete="on"
        >


          <div class="form-group">

            <label for="email">
              Adresse Gmail
            </label>

            <input
              type="email"
              id="email"
              name="email"
              placeholder="exemple@gmail.com"
              autocomplete="email"
              required
            >

          </div>


          <div class="form-group">

            <label for="password">
              Mot de passe
            </label>

            <input
              type="password"
              id="password"
              name="password"
              placeholder="Votre mot de passe"
              autocomplete="current-password"
              required
            >

          </div>


          <!-- MESSAGE -->

          <div
            id="authMessage"
            aria-live="polite"
          ></div>


          <!-- BOUTON -->

          <button
            type="submit"
            class="btn btn-primary auth-submit"
          >
            Se connecter
          </button>


        </form>


        <!-- ==========================
             CRÉATION COMPTE
        =========================== -->

        <div class="auth-footer">

          <span>
            Vous n'avez pas encore de compte ?
          </span>

          <a href="/register.html">
            Créer un compte
          </a>

        </div>


      </div>

    </section>

  </main>


  <script src="/js/auth.js"></script>

</body>

</html>
