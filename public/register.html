<!DOCTYPE html>
<html lang="fr">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Créer un compte — NOSMYBOOST🇧🇪</title>

  <link
    rel="stylesheet"
    href="/css/style.css"
  >

</head>


<body>

  <header class="navbar">

    <div class="container nav-content">

      <a
        href="/"
        class="logo"
      >
        NOSMYBOOST🇧🇪
      </a>

      <a
        href="/login.html"
        class="btn btn-outline"
      >
        Connexion
      </a>

    </div>

  </header>


  <main>

    <section class="hero">

      <div
        class="container"
        style="max-width: 560px;"
      >

        <div class="section-title">

          <span>
            NOSMYBOOST🇧🇪
          </span>

          <h1>
            Créer un compte
          </h1>

          <p>
            Rejoignez NOSMYBOOST et gérez
            facilement vos commandes SMM.
          </p>

        </div>


        <form
          id="registerForm"
          class="feature-card"
        >

          <!-- NOM -->

          <div style="margin-bottom:18px;">

            <label for="name">
              Votre nom
            </label>

            <input
              id="name"
              name="name"
              type="text"
              placeholder="Leader Nosmy"
              autocomplete="name"
              required
              style="
                width:100%;
                margin-top:7px;
                padding:13px;
                border:1px solid #d7dde7;
                border-radius:10px;
                outline:none;
              "
            >

          </div>


          <!-- EMAIL -->

          <div style="margin-bottom:18px;">

            <label for="email">
              Adresse Gmail
            </label>

            <input
              id="email"
              name="email"
              type="email"
              placeholder="votre@email.com"
              autocomplete="email"
              required
              style="
                width:100%;
                margin-top:7px;
                padding:13px;
                border:1px solid #d7dde7;
                border-radius:10px;
                outline:none;
              "
            >

          </div>


          <!-- WHATSAPP -->

          <div style="margin-bottom:18px;">

            <label for="whatsapp">
              Numéro WhatsApp
            </label>

            <input
              id="whatsapp"
              name="whatsapp"
              type="tel"
              placeholder="+243..."
              autocomplete="tel"
              style="
                width:100%;
                margin-top:7px;
                padding:13px;
                border:1px solid #d7dde7;
                border-radius:10px;
                outline:none;
              "
            >

          </div>


          <!-- PAYS -->

          <div style="margin-bottom:18px;">

            <label for="country">
              Pays
            </label>

            <select
              id="country"
              name="country"
              required
              style="
                width:100%;
                margin-top:7px;
                padding:13px;
                border:1px solid #d7dde7;
                border-radius:10px;
                background:white;
                outline:none;
              "
            >

              <option value="CD">
                🇨🇩 RD Congo
              </option>

              <option value="CG">
                🇨🇬 Congo-Brazzaville
              </option>

              <option value="BE">
                🇧🇪 Belgique
              </option>

              <option value="FR">
                🇫🇷 France
              </option>

              <option value="OTHER">
                🌍 Autre
              </option>

            </select>

          </div>


          <!-- MOT DE PASSE -->

          <div style="margin-bottom:18px;">

            <label for="password">
              Mot de passe
            </label>

            <input
              id="password"
              name="password"
              type="password"
              placeholder="Minimum 8 caractères"
              autocomplete="new-password"
              minlength="8"
              required
              style="
                width:100%;
                margin-top:7px;
                padding:13px;
                border:1px solid #d7dde7;
                border-radius:10px;
                outline:none;
              "
            >

          </div>


          <!-- CONFIRMATION -->

          <div style="margin-bottom:20px;">

            <label for="passwordConfirm">
              Confirmer le mot de passe
            </label>

            <input
              id="passwordConfirm"
              name="passwordConfirm"
              type="password"
              placeholder="Répétez votre mot de passe"
              autocomplete="new-password"
              minlength="8"
              required
              style="
                width:100%;
                margin-top:7px;
                padding:13px;
                border:1px solid #d7dde7;
                border-radius:10px;
                outline:none;
              "
            >

          </div>


          <!-- MESSAGE -->

          <div
            id="registerMessage"
            style="
              margin-bottom:18px;
              font-size:14px;
            "
          ></div>


          <!-- BOUTON -->

          <button
            id="registerButton"
            type="submit"
            class="btn btn-primary"
            style="width:100%;"
          >
            Créer mon compte
          </button>


          <p
            style="
              text-align:center;
              margin-top:18px;
              color:#667085;
              font-size:14px;
            "
          >

            Déjà un compte ?

            <a
              href="/login.html"
              style="
                font-weight:700;
                text-decoration:underline;
              "
            >
              Connectez-vous
            </a>

          </p>

        </form>

      </div>

    </section>

  </main>


  <script src="/js/auth.js"></script>

</body>

</html>
