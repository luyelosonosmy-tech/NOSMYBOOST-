<!DOCTYPE html>
<html lang="fr">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Créer un compte — NOSMYBOOST🇧🇪</title>

  <link
    rel="stylesheet"
    href="/css/style.css"
  >

</head>


<body>

  <header class="navbar">

    <div class="container nav-content">

      <a
        href="/"
        class="logo"
      >
        NOSMYBOOST🇧🇪
      </a>

      <a
        href="/login.html"
        class="btn btn-outline"
      >
        Connexion
      </a>

    </div>

  </header>


  <main>

    <section class="auth-section">

      <div class="auth-card">

        <div class="auth-header">

          <span>
            NOSMYBOOST🇧🇪
          </span>

          <h1>
            Créer un compte
          </h1>

          <p>
            Créez votre compte et commencez
            à utiliser nos services.
          </p>

        </div>


        <form
          id="registerForm"
          autocomplete="on"
        >


          <!-- NOM -->

          <div class="form-group">

            <label for="name">
              Votre nom
            </label>

            <input
              type="text"
              id="name"
              name="name"
              placeholder="Ex. Leader Nosmy"
              autocomplete="name"
              required
            >

          </div>


          <!-- EMAIL -->

          <div class="form-group">

            <label for="email">
              Adresse Gmail
            </label>

            <input
              type="email"
              id="email"
              name="email"
              placeholder="exemple@gmail.com"
              autocomplete="email"
              required
            >

          </div>


          <!-- WHATSAPP -->

          <div class="form-group">

            <label for="whatsapp">
              Numéro WhatsApp
            </label>

            <input
              type="tel"
              id="whatsapp"
              name="whatsapp"
              placeholder="+243 8XX XXX XXX"
              autocomplete="tel"
            >

          </div>


          <!-- PAYS -->

          <div class="form-group">

            <label for="country">
              Pays
            </label>

            <select
              id="country"
              name="country"
            >

              <option value="CD" selected>
                🇨🇩 RD Congo
              </option>

              <option value="CG">
                🇨🇬 Congo-Brazzaville
              </option>

              <option value="BE">
                🇧🇪 Belgique
              </option>

              <option value="FR">
                🇫🇷 France
              </option>

              <option value="OTHER">
                🌍 Autre pays
              </option>

            </select>

          </div>


          <!-- MOT DE PASSE -->

          <div class="form-group">

            <label for="password">
              Mot de passe
            </label>

            <input
              type="password"
              id="password"
              name="password"
              placeholder="Minimum 8 caractères"
              minlength="8"
              autocomplete="new-password"
              required
            >

          </div>


          <!-- MESSAGE -->

          <div
            id="authMessage"
            aria-live="polite"
          ></div>


          <!-- BOUTON -->

          <button
            type="submit"
            class="btn btn-primary auth-submit"
          >
            Créer un compte
          </button>


        </form>


        <div class="auth-footer">

          <span>
            Déjà un compte ?
          </span>

          <a href="/login.html">
            Connectez-vous
          </a>

        </div>


      </div>

    </section>

  </main>


  <script src="/js/auth.js"></script>

</body>

</html>
